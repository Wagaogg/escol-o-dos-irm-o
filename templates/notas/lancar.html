{% extends 'base.html' %}
{% block title %}Lançar Nota - Sistema Escolar{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="fw-bold">📝 Lançar Nota</h1>
            <p class="text-secondary">Selecione aluno, disciplina, bimestre e insira a nota.</p>
        </div>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">← Voltar</a>
    </div>

    <div class="card shadow border-0">
        <div class="card-body p-4">

            <form method="POST">

                <div class="row g-3">

                    <div class="col-md-3">
                        <label class="form-label">Aluno *</label>
                        <select name="aluno_id" class="form-control" required>
                            <option value="">Selecione...</option>
                            {% for a in alunos %}
                            <option value="{{ a.id }}">{{ a.nome }} ({{ a.matricula }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Disciplina *</label>
                        <select name="disciplina" class="form-control" required>
                            <option value="">Selecione...</option>
                            {% for d in disciplinas %}
                            <option value="{{ d }}">{{ d }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Bimestre *</label>
                        <select name="bimestre" class="form-control" required>
                            <option value="">Selecione...</option>
                            {% for b in bimestres %}
                            <option value="{{ b }}">{{ b }}º Bimestre</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Nota (0 a 10) *</label>
                        <input type="number" name="nota" class="form-control" step="0.1" min="0" max="10" placeholder="Ex: 7.5" required>
                    </div>

                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">✅ Lançar</button>
                    </div>

                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
