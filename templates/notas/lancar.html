{% extends 'base.html' %}
{% block title %}Lançar Nota - SEApp{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="fw-bold" style="color: #f1f5f9;">📝 Lançar Nota</h1>
            <p style="color: #94a3b8;">Selecione um aluno, a disciplina e insira a nota.</p>
        </div>
        <!-- CORRIGIDO: dashboard.home → dashboard.index -->
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary">← Voltar</a>
    </div>

    <div class="card shadow border-0" style="background: #1e293b;">
        <div class="card-body p-4">

            <!-- CORRIGIDO: lancar_nota → notas.lancar_nota -->
            <form method="POST" action="{{ url_for('notas.lancar_nota') }}">

                <div class="row g-3">

                    <div class="col-md-4">
                        <label class="form-label" style="color: #f1f5f9;">Aluno *</label>
                        <select name="aluno_id" class="form-control" required style="background: #0f172a; color: #f1f5f9; border: 1px solid #334155;">
                            <option value="">Selecione...</option>
                            {% for a in alunos %}
                            <option value="{{ a.id }}">{{ a.nome }} ({{ a.matricula }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label" style="color: #f1f5f9;">Disciplina *</label>
                        <select name="disciplina" class="form-control" required style="background: #0f172a; color: #f1f5f9; border: 1px solid #334155;">
                            <option value="">Selecione...</option>
                            {% for d in disciplinas %}
                            <option value="{{ d }}">{{ d }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label" style="color: #f1f5f9;">Bimestre *</label>
                        <select name="bimestre" class="form-control" required style="background: #0f172a; color: #f1f5f9; border: 1px solid #334155;">
                            <option value="">Selecione...</option>
                            {% for b in bimestres %}
                            <option value="{{ b }}">{{ b }}º Bimestre</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label" style="color: #f1f5f9;">Nota (0 a 10) *</label>
                        <input type="number" name="nota" class="form-control" step="0.1" min="0" max="10" placeholder="Ex: 7.5" required style="background: #0f172a; color: #f1f5f9; border: 1px solid #334155;">
                    </div>

                    <div class="col-md-1 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">✅</button>
                    </div>

                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
