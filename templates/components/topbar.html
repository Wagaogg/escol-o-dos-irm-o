<header class="topbar">
    <a class="topbar-brand" href="{{ url_for('dashboard.index') }}">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#5865F2" viewBox="0 0 16 16">
            <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.707 1.5ZM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5 5 5Z"/>
        </svg>
        SEApp
    </a>

    <div class="topbar-right">

        <!-- Notificações -->
        <a href="{{ url_for('notificacoes.listar') }}" id="sinoNotificacoes" style="position: relative; display: flex; align-items: center; padding: 6px 10px; border-radius: 4px; color: var(--text-2);" onmouseover="this.style.background='var(--surface)'" onmouseout="this.style.background='transparent'">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zM8 1.918l-.797.161A4.002 4.002 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4.002 4.002 0 0 0-3.203-3.92L8 1.917zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5.002 5.002 0 0 1 13 6c0 .88.32 4.2 1.22 6z"/>
            </svg>
            <span id="contadorNotificacoes" class="position-absolute rounded-pill" style="display: none; font-size: 0.6rem; padding: 2px 5px; top: 2px; right: 2px; background: var(--danger); color: white; font-weight: 700;">
                0
            </span>
        </a>

        <!-- Usuário -->
        <div class="topbar-user">
            <span class="topbar-badge {% if session.get('tipo') in ['admin','diretor'] %}badge-admin{% else %}badge-aluno{% endif %}">
                {{ session.get("tipo", "").upper() }}
            </span>
            <span>{{ session["usuario"] }}</span>
        </div>

        <!-- Sair -->
        <a href="{{ url_for('auth.logout') }}" class="topbar-logout">Sair</a>

    </div>
</header>

<script>
document.addEventListener('DOMContentLoaded', function() {
    function atualizarContador() {
        fetch('/api/notificacoes/contar')
            .then(response => response.json())
            .then(data => {
                const badge = document.getElementById('contadorNotificacoes');
                if (data.total > 0) {
                    badge.textContent = data.total;
                    badge.style.display = 'inline-block';
                } else {
                    badge.style.display = 'none';
                }
            })
            .catch(() => {});
    }
    atualizarContador();
    setInterval(atualizarContador, 30000);
});
</script>
