{% extends 'base.html' %}
{% block title %}Fazer Chamada - SEApp{% endblock %}

{% block content %}

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="fw-bold" style="color: #f1f5f9;">📋 Fazer Chamada</h1>
            <p style="color: #94a3b8;">Escolha a turma, disciplina e data.</p>
        </div>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary">← Voltar</a>
    </div>

    <div class="card border-0 shadow" style="background: #1e293b;">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('frequencia.marcar_lista') }}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label" style="color: #f1f5f9;">Turma *</label>
                        <select name="turma" class="form-control" required style="background: #0f172a; color: #f1f5f9; border: 1px solid #334155;">
                            <option value="">Selecione...</option>
                            {% for t in turmas %}
                            <option value="{{ t }}">{{ t }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" style="color: #f1f5f9;">Disciplina *</label>
                        <select name="disciplina" class="form-control" required style="background: #0f172a; color: #f1f5f9; border: 1px solid #334155;">
                            <option value="">Selecione...</option>
                            {% for d in disciplinas %}
                            <option value="{{ d }}">{{ d }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" style="color: #f1f5f9;">Data *</label>
                        <input type="date" name="data" class="form-control" required style="background: #0f172a; color: #f1f5f9; border: 1px solid #334155;">
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">📋 Fazer Chamada</button>
                    <a href="{{ url_for('frequencia.relatorio') }}" class="btn btn-outline-secondary">📊 Ver Relatório</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
