{% extends 'base.html' %}
{% block title %}Marcar Presença - SEApp{% endblock %}

{% block content %}

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="fw-bold" style="color: #f1f5f9;">📋 Marcar Presença</h1>
            <p style="color: #94a3b8;">Registre a presença dos alunos.</p>
        </div>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary">← Voltar</a>
    </div>

    <div class="card border-0 shadow" style="background: #1e293b;">
        <div class="card-body p-4">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label" style="color: #f1f5f9;">Aluno *</label>
                        <select name="aluno_id" class="form-control" required style="background: #0f172a; color: #f1f5f9; border: 1px solid #334155;">
                            <option value="">Selecione...</option>
                            {% for a in alunos %}
                            <option value="{{ a.id }}">{{ a.nome }} ({{ a.turma or 'sem turma' }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" style="color: #f1f5f9;">Disciplina *</label>
                        <select name="disciplina" class="form-control" required style="background: #0f172a; color: #f1f5f9; border: 1px solid #334155;">
                            <option value="">Selecione...</option>
                            {% for d in disciplinas %}
                            <option value="{{ d }}">{{ d }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" style="color: #f1f5f9;">Data *</label>
                        <input type="date" name="data" class="form-control" required style="background: #0f172a; color: #f1f5f9; border: 1px solid #334155;">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" style="color: #f1f5f9;">Status *</label>
                        <select name="status" class="form-control" required style="background: #0f172a; color: #f1f5f9; border: 1px solid #334155;">
                            <option value="presente">Presente</option>
                            <option value="falta">Falta</option>
                            <option value="justificada">Justificada</option>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label" style="color: #f1f5f9;">Observação</label>
                        <input type="text" name="observacao" class="form-control" placeholder="Opcional" style="background: #0f172a; color: #f1f5f9; border: 1px solid #334155;">
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">✅ Registrar</button>
                    <a href="{{ url_for('frequencia.relatorio') }}" class="btn btn-outline-secondary">📊 Ver Relatório</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
