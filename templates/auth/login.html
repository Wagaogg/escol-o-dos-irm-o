<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #17202E, #1E293B);
            min-height: 100vh;
        }
        .login-card {
            background: #273449 !important;
            border: 1px solid #334155 !important;
        }
        .form-control {
            background: #1E293B !important;
            color: #F8FAFC !important;
            border: 1px solid #334155 !important;
        }
        .form-control:focus {
            background: #1E293B !important;
            color: #F8FAFC !important;
            border-color: #3B82F6 !important;
            box-shadow: none !important;
        }
        .form-label { color: #CBD5E1 !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center align-items-center vh-100">
        <div class="col-md-5">

            <div class="card shadow-lg p-4 login-card">

                <div class="text-center mb-4">
                    <span style="font-size: 3rem;">🏫</span>
                    <h1 class="fw-bold mt-2" style="color: #F8FAFC;">Sistema Escolar</h1>
                    <p style="color: #94A3B8;">Faça login para continuar</p>
                </div>

                {% if erro %}
                <div class="alert alert-danger text-center">
                    ❌ Email ou senha inválidos
                </div>
                {% endif %}

                <form action="{{ url_for('auth.autenticar') }}" method="POST">

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Senha</label>
                        <input type="password" name="senha" class="form-control" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Entrar</button>

                </form>

                <hr style="border-color: #334155;">

                <a href="{{ url_for('auth.cadastro') }}" class="btn btn-outline-secondary w-100">
    Criar conta
</a>

            </div>

        </div>
    </div>
</div>

</body>
</html>
