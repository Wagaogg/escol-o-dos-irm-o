{% extends 'base.html' %}
{% block title %}Login - SEApp{% endblock %}

{% block content_auth %}

<div class="login-page">
    <div class="login-card">
        <div class="brand">SEApp</div>
        <p class="subtitle">Faça login para continuar</p>

        {% if erro %}
        <div class="alert alert-danger text-center">Email ou senha inválidos</div>
        {% endif %}

        <form action="{{ url_for('auth.autenticar') }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Senha</label>
                <input type="password" name="senha" class="form-control" placeholder="Sua senha" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>

        <div class="text-center mt-4">
            <a href="{{ url_for('auth.cadastro') }}" style="font-size: 0.875rem;">Criar conta</a>
        </div>
    </div>
</div>

{% endblock %}
